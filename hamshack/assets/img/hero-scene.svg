<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05080c"/>
      <stop offset=".55" stop-color="#0b1622"/>
      <stop offset="1" stop-color="#132536"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".78" cy=".35" r=".45"><stop offset="0" stop-color="#22d3ee" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx=".2" cy=".9" r=".5"><stop offset="0" stop-color="#ff9f1c" stop-opacity=".12"/><stop offset="1" stop-color="#ff9f1c" stop-opacity="0"/></radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1c28"/><stop offset="1" stop-color="#0a121a"/></linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a141d"/><stop offset="1" stop-color="#070d13"/></linearGradient>
  </defs>
  <rect width="1600" height="640" fill="url(#sky)"/>
  <rect width="1600" height="640" fill="url(#glowA)"/>
  <rect width="1600" height="640" fill="url(#glowB)"/>

  <!-- stars -->
  <g fill="#cfe7ff">
    <circle cx="80" cy="60" r="1.2" opacity=".7"/><circle cx="190" cy="140" r="1" opacity=".5"/><circle cx="260" cy="40" r="1.4" opacity=".8"/>
    <circle cx="360" cy="110" r=".9" opacity=".5"/><circle cx="450" cy="70" r="1.2" opacity=".6"/><circle cx="540" cy="30" r="1" opacity=".7"/>
    <circle cx="610" cy="150" r="1.1" opacity=".4"/><circle cx="700" cy="60" r="1.5" opacity=".9"/><circle cx="780" cy="120" r=".9" opacity=".5"/>
    <circle cx="860" cy="40" r="1.2" opacity=".6"/><circle cx="940" cy="170" r="1" opacity=".4"/><circle cx="1020" cy="80" r="1.3" opacity=".8"/>
    <circle cx="1110" cy="30" r="1" opacity=".5"/><circle cx="1180" cy="130" r="1.2" opacity=".6"/><circle cx="1260" cy="60" r=".9" opacity=".5"/>
    <circle cx="1340" cy="150" r="1.4" opacity=".7"/><circle cx="1420" cy="50" r="1.1" opacity=".6"/><circle cx="1510" cy="110" r="1" opacity=".5"/>
    <circle cx="1560" cy="30" r="1.3" opacity=".8"/><circle cx="130" cy="230" r=".8" opacity=".35"/><circle cx="320" cy="210" r=".8" opacity=".35"/>
    <circle cx="1450" cy="220" r=".8" opacity=".35"/><circle cx="660" cy="240" r=".8" opacity=".3"/><circle cx="1000" cy="240" r=".8" opacity=".3"/>
  </g>
  <!-- moon -->
  <circle cx="1400" cy="120" r="34" fill="#e9f1f8" opacity=".85"/>
  <circle cx="1414" cy="110" r="32" fill="#0a1520"/>

  <!-- signal arcs from mast -->
  <g fill="none" stroke="#22d3ee" stroke-linecap="round">
    <path d="M1250 250 a70 70 0 0 1 0 100" stroke-width="3" opacity=".55"/>
    <path d="M1280 215 a120 120 0 0 1 0 170" stroke-width="2.5" opacity=".35"/>
    <path d="M1310 180 a170 170 0 0 1 0 240" stroke-width="2" opacity=".2"/>
    <path d="M1130 250 a70 70 0 0 0 0 100" stroke-width="3" opacity=".55"/>
    <path d="M1100 215 a120 120 0 0 0 0 170" stroke-width="2.5" opacity=".35"/>
    <path d="M1070 180 a170 170 0 0 0 0 240" stroke-width="2" opacity=".2"/>
  </g>

  <!-- far hills -->
  <path d="M0 470 C160 430 300 440 420 455 C560 470 640 420 780 430 C920 440 1040 470 1180 450 C1320 430 1460 440 1600 420 V640 H0Z" fill="url(#hill1)"/>

  <!-- cathedral silhouette (generic gothic spire on the horizon) -->
  <g fill="#15283a" stroke="#22d3ee" stroke-opacity=".12">
    <path d="M520 470 V420 H560 V400 H600 V420 H640 V470Z"/>
    <path d="M640 470 V410 H700 V470Z"/>
    <path d="M700 470 V430 H760 V470Z"/>
    <rect x="585" y="330" width="30" height="80"/>
    <path d="M588 332 L600 170 L612 332Z"/>
    <path d="M580 340 h40 v-8 h-40z"/>
    <path d="M583 330 L586 300 L589 330Z M611 330 L614 300 L617 330Z"/>
    <path d="M460 470 V440 H520 V470Z"/>
  </g>
  <g fill="#ffd166" opacity=".35">
    <rect x="596" y="360" width="3" height="10"/><rect x="602" y="360" width="3" height="10"/>
    <rect x="530" y="440" width="3" height="10"/><rect x="545" y="440" width="3" height="10"/>
  </g>

  <!-- near hill -->
  <path d="M0 540 C220 500 420 520 640 515 C860 510 1000 470 1190 470 C1360 470 1480 500 1600 490 V640 H0Z" fill="url(#hill2)"/>

  <!-- lattice mast with yagi -->
  <g stroke="#1f3142" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M1190 300 L1172 480 M1190 300 L1208 480"/>
    <path d="M1176 440 H1204 M1179 400 H1201 M1182 360 H1198 M1185 330 H1195"/>
    <path d="M1176 440 L1201 400 M1204 440 L1179 400 M1179 400 L1198 360 M1201 400 L1182 360 M1182 360 L1195 330 M1198 360 L1185 330"/>
  </g>
  <g stroke="#ffb020" stroke-width="3" stroke-linecap="round" opacity=".9">
    <path d="M1190 300 V268"/>
    <path d="M1120 290 H1260"/>
    <path d="M1130 272 V308 M1152 268 V312 M1174 270 V310 M1198 274 V306 M1220 276 V304 M1242 278 V302"/>
  </g>
  <circle cx="1190" cy="262" r="5" fill="#ff3b3b"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle>

  <!-- shack with lit window -->
  <g>
    <path d="M1260 490 V455 L1290 432 L1320 455 V490Z" fill="#0b151e"/>
    <rect x="1280" y="460" width="18" height="14" fill="#ffb020" opacity=".75"/>
    <path d="M1190 300 C1230 360 1260 420 1290 440" stroke="#1f3142" stroke-width="1.5" fill="none"/>
  </g>

  <!-- ground grid glow -->
  <path d="M0 600 H1600" stroke="#22d3ee" stroke-opacity=".08"/>
  <rect y="600" width="1600" height="40" fill="#060b10"/>
</svg>
